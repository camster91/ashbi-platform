  # One-shot schema sync. Runs `prisma db push` against the test DB.
  # Uses the production Dockerfile but overrides command to `npm install`
  # first (devDependencies include the `prisma` CLI) then run a wrapper
  # that materializes DATABASE_URL into a .env file (so prisma.config.ts's
  # `import 'dotenv/config'` can pick it up) and then calls db push.
  #
  # Why this dance: Prisma 7 reads the URL from prisma.config.ts's
  # `datasource.url`, but the test compose doesn't write a .env file.
  # `import 'dotenv/config'` only sets vars that exist in .env; it doesn't
  # synthesize them. So we write /app/.env with DATABASE_URL=... explicitly
  # to make sure prisma.config.ts sees the URL at config-load time.
  # Source: prisma.config.ts line 12 — `datasource: { url: process.env.DATABASE_URL }`.
  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        npm install --no-audit --no-fund
        # Materialize DATABASE_URL into .env (prisma.config.ts's dotenv picks it up).
        printf 'DATABASE_URL="%s"\n' "$$DATABASE_URL" > /app/.env
        # Also export so child processes see it directly.
        export DATABASE_URL="$$DATABASE_URL"
        # Run db push. URL comes from prisma.config.ts datasource.url.
        exec npx prisma db push --accept-data-loss
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ashbi_test:ashbi_test@postgres:5432/ashbi_test
