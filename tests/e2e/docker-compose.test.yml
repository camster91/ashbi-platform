# tests/e2e/docker-compose.test.yml
#
# Hub stack for the full-stack end-to-end smoke test.
#
# Services:
#   postgres  — fresh DB per test run (no volume)
#   redis     — required for BullMQ queues and the /api/health readiness
#               check (database + redis + worker heartbeat must all be ok).
#   migrate   — one-shot `npx prisma migrate deploy` against the test DB.
#               Prisma 7 reads the URL through prisma.config.ts, which only
#               sees vars present in .env, so the entrypoint materializes
#               DATABASE_URL into /app/.env first.
#   seed      — one-shot `node prisma/seed.js` after migrate completes.
#               Creates cameron@ashbi.ca with the role ADMIN so the test
#               can log in via /api/auth/login.
#   worker    — BullMQ worker. Writes the redis heartbeat that /api/health
#               requires for readiness; without it hub never reports ready.
#   hub       — ashbi-platform image running Fastify. depends_on
#               postgres (healthy) + redis (healthy) + migrate (succeeded)
#               + seed (succeeded).
#
# ADMIN_SEED_PASSWORD matches ADMIN_PASSWORD the test logs in with.
#
# Usage:
#   docker compose -f tests/e2e/docker-compose.test.yml up -d
#   docker compose -f tests/e2e/docker-compose.test.yml down -v

services:
  postgres:
    # Prisma declares the vector extension, so the disposable test database
    # must provide pgvector rather than plain PostgreSQL.
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ashbi_test
      POSTGRES_PASSWORD: ashbi_test
      POSTGRES_DB: ashbi_test
    # No volumes — fresh DB per run.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashbi_test -d ashbi_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "54329:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: "no"
    # Test-only setup needs devDependencies (Prisma CLI) and writes a
    # disposable .env. The long-running hub remains the non-root image user.
    user: root
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        npm ci --no-audit --no-fund
        printf 'DATABASE_URL="%s"\n' "$$DATABASE_URL" > /app/.env
        export DATABASE_URL="$$DATABASE_URL"
        exec npx prisma migrate deploy
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ashbi_test:ashbi_test@postgres:5432/ashbi_test

  seed:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: "no"
    # Test-only setup installs the locked dev tree for the seed helper.
    user: root
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npx prisma generate && node prisma/seed.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ashbi_test:ashbi_test@postgres:5432/ashbi_test
      ADMIN_SEED_PASSWORD: TestPass123!

  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Not "test": src/jobs/queue.js swaps in mock queues with no Redis
      # connection when NODE_ENV=test, so the heartbeat would never be written.
      NODE_ENV: e2e
      DATABASE_URL: postgresql://ashbi_test:ashbi_test@postgres:5432/ashbi_test
      REDIS_URL: redis://redis:6379
      JWT_SECRET: test-jwt-secret-do-not-use-in-prod

  hub:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
      worker:
        condition: service_started
    environment:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://ashbi_test:ashbi_test@postgres:5432/ashbi_test
      REDIS_URL: redis://redis:6379
      JWT_SECRET: test-jwt-secret-do-not-use-in-prod
      ADMIN_EMAIL: cameron@ashbi.ca
      ADMIN_PASSWORD: TestPass123!
      # Serve the image's built SPA (dist/) from this origin so the Playwright
      # journeys drive the real UI against the real API.
      SERVE_BUILT_SPA: "true"
      # The journeys' browser and API client share one IP; the production
      # default of 100 API requests/minute would throttle them mid-journey.
      API_RATE_LIMIT_MAX: "2000"
    ports:
      - "${HOST_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
