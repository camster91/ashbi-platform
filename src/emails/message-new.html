<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Message</title>
</head>
<body style="margin:0;padding:0;background-color:{{theme.cream}};font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:{{theme.cream}};">
  <tr>
    <td align="center" style="padding:24px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;">

        <!-- Header -->
        <tr>
          <td style="background-color:{{theme.indigo}};border-radius:12px 12px 0 0;padding:32px 40px;text-align:center;">
            <h1 style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:700;color:{{theme.white}};letter-spacing:0.5px;">ashbi</h1>
            <p style="margin:4px 0 0;font-family:system-ui,-apple-system,sans-serif;font-size:12px;color:{{theme.lime}};text-transform:uppercase;letter-spacing:3px;">Design &amp; Development</p>
          </td>
        </tr>

        <!-- Accent bar -->
        <tr>
          <td style="padding:0;">
            <div style="height:4px;background:linear-gradient(90deg,{{theme.lime}} 0%,{{theme.indigo}} 100%);"></div>
          </td>
        </tr>

        <!-- Body -->
        <tr>
          <td style="background-color:{{theme.white}};padding:40px;">
            <h2 style="margin:0 0 8px;font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:700;color:{{theme.indigo}};">New message from {{senderName}}</h2>
            <p style="margin:0 0 24px;font-size:15px;color:{{theme.text}};line-height:1.6;">Hi {{clientName}}, you've got a new message in your project.</p>

            <!-- Chat bubble -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-bottom:28px;">
              <tr>
                <td style="background-color:{{theme.cream}};border:1px solid {{theme.border}};border-radius:12px;padding:24px;">
                  <!-- Sender name row -->
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                    <tr>
                      <td style="padding-bottom:12px;">
                        <table role="presentation" cellpadding="0" cellspacing="0">
                          <tr>
                            <td style="background-color:{{theme.indigo}};border-radius:50%;width:32px;height:32px;text-align:center;vertical-align:middle;">
                              <p style="margin:0;color:{{theme.white}};font-size:13px;font-weight:700;">{{senderInitial}}</p>
                            </td>
                            <td style="padding-left:10px;">
                              <p style="margin:0;font-size:14px;font-weight:600;color:{{theme.indigo}};">{{senderName}}</p>
                            </td>
                          </tr>
                        </table>
                      </td>
                    </tr>
                  </table>
                  <!-- Message preview bubble -->
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                    <tr>
                      <td style="background-color:{{theme.white}};border:1px solid {{theme.border}};border-radius:8px;border-top-left-radius:0;padding:14px 18px;">
                        <p style="margin:0;font-size:14px;color:{{theme.textStrong}};line-height:1.5;">{{messagePreview}}</p>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>
            </table>

            <!-- CTA Button -->
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
              <tr>
                <td align="center" style="padding:8px 0 32px;">
                  <a href="{{portalLink}}" style="display:inline-block;background-color:{{theme.lime}};color:{{theme.indigo}};text-decoration:none;font-family:system-ui,-apple-system,sans-serif;font-size:15px;font-weight:600;padding:14px 36px;border-radius:50px;box-shadow:0 4px 14px {{theme.limeGlow}};">Reply in Portal</a>
                </td>
              </tr>
            </table>

            <p style="margin:0;font-size:13px;color:{{theme.textMuted}};line-height:1.6;">Head to your portal to read the full message and reply.</p>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="background-color:{{theme.indigo}};border-radius:0 0 12px 12px;padding:24px 40px;text-align:center;">
            <p style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:16px;font-weight:700;color:{{theme.white}};letter-spacing:0.5px;">ashbi</p>
            <p style="margin:4px 0 16px;font-size:12px;color:{{theme.footerText}};"><a href="https://ashbi.ca" style="color:{{theme.lime}};text-decoration:none;">ashbi.ca</a></p>
            <p style="margin:0;font-size:11px;color:{{theme.footerTextSoft}};">Sent with care from Ashbi Hub</p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
