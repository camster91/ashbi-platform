name: Enterprise Compliance & Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compliance:
    name: Lint & Compliance Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Linting
        run: npm run lint
        
      - name: Multi-Tenancy Compliance Scan
        run: |
          # Ensure no direct prisma imports in routes (must use request.prisma)
          # Grep returns 1 if no matches found, which is what we want
          ! grep -r "import prisma from '../config/db.js'" src/routes/
          
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Use pgvector/pgvector:pg16 — schema.prisma declares
        # `extensions = [vector]`, which requires the pgvector extension.
        # The stock postgres:16-alpine image doesn't ship it. pgvector
        # publishes pg16 as `pg16` (debian bookworm); there is no
        # `-alpine` tag for pg16 (only `pg16-trixie` and `pg16-bookworm`).
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        # Required before any test that touches @prisma/client — the runtime
        # resolves to .prisma/client/default which only exists after this step.
        # No postinstall hook in package.json runs it automatically.
        run: npx prisma generate
      - name: Setup database
        # Use `db push` (not `migrate deploy`) because the migration history
        # has no baseline — the earliest migration in this repo
        # (20260318_add_credentials_templates_portal) ALTERs "projects" but
        # never CREATEs it, so `migrate deploy` against a fresh DB fails with
        # `relation "projects" does not exist`. The baseline migration was
        # intentionally removed (commit 3df7615) because it conflicted with
        # the existing production schema. For CI test databases we sync
        # directly from schema.prisma; production runs continue to use
        # `prisma migrate deploy` via scripts/start.sh against an already-
        # bootstrapped database.
        # Note: Prisma 7 removed `--skip-generate`; client gen is handled by
        # the npm install postinstall hook (`prisma generate`) so a plain
        # `db push` is correct here.
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/testdb
      - name: Run Backend Tests
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test-secret
          DATABASE_URL: postgresql://postgres:testpass@localhost:5432/testdb
          
  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: cd web && npm install
      - name: Run Frontend Tests
        run: cd web && npx vitest run --coverage
