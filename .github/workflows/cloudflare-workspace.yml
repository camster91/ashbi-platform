name: Cloudflare workspace checks

on:
  pull_request:
    paths:
      - 'apps/workspace/**'
      - 'scripts/inventory-migration-source.mjs'
      - 'src/services/notion-markdown-import.service.js'
      - 'src/services/workspace-export.service.js'
      - 'src/utils/stored-upload.js'
      - 'src/utils/send-file.js'
      - 'src/security/file-upload-policy.js'
      - '.github/workflows/cloudflare-workspace.yml'

permissions:
  contents: read

jobs:
  api:
    name: Signed identity and compiled Worker contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: apps/workspace
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Exercise signed identity and local persistence
        run: npm test
      - name: Build without publishing
        run: npm run build
      - name: Exercise compiled invoice persistence and financial contracts
        run: npm run test:invoice-built

  browser_groups:
    name: Built UI, keyboard and responsive accessibility (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [core, commerce, contracts]
    env:
      CI: true
      WRANGLER_SEND_METRICS: 'false'
      WORKSPACE_BROWSER_GROUP: ${{ matrix.group }}
    defaults:
      run:
        working-directory: apps/workspace
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Build without publishing
        run: npm run build
      - name: Install browser for built-artifact checks
        run: npx playwright install --with-deps chromium
      - name: Exercise built UI, keyboard and responsive accessibility
        run: npm run test:browser

  browser:
    name: Built UI, keyboard and responsive accessibility
    needs: [browser_groups]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every browser group to succeed
        env:
          BROWSER_GROUPS_RESULT: ${{ needs.browser_groups.result }}
        run: '[[ "$BROWSER_GROUPS_RESULT" == success ]]'

  recovery:
    name: Isolated native D1 and private R2 recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CI: true
      WRANGLER_SEND_METRICS: 'false'
    defaults:
      run:
        working-directory: apps/workspace
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund
      - name: Rehearse native local database and private-object recovery
        run: npm run test:recovery
      - name: Build without publishing
        run: npm run build
      - name: Rehearse recovery through compiled application routes
        run: npm run test:recovery-built

  workspace:
    name: Local Worker and D1 integration
    needs: [api, browser, recovery]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require API, browser and recovery validation to succeed
        env:
          API_RESULT: ${{ needs.api.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          RECOVERY_RESULT: ${{ needs.recovery.result }}
        run: '[[ "$API_RESULT" == success && "$BROWSER_RESULT" == success && "$RECOVERY_RESULT" == success ]]'
