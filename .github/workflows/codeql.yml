name: 'CodeQL'

on:
  push:
    branches: ['main']
  schedule:
    - cron: '0 3 * * *'

# SECURITY (audit 2026-07-09): add concurrency + job timeout. The
# 3am-UTC scheduled run can collide with a mid-analysis push to main
# (now two parallel CodeQL scans). Default job timeout is 360 min,
# wildly generous for what should be a < 30 min scan.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.38.0
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4.38.0
