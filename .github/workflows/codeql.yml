name: 'CodeQL'

on:
  push:
    branches: ['main']
  schedule:
    - cron: '0 3 * * 0'

# Scheduled weekly as a fallback; every main push is still analyzed.
# Concurrency prevents an overlapping push/scheduled scan from duplicating work.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4.38.1
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4.38.1
