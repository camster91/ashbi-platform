name: Mobile internal testing

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Testing destination
        type: choice
        options: [ios, android]
        required: true
      source_commit:
        description: Full source commit of the signed build
        type: string
        required: true
      build_run_id:
        description: Successful approved-branch build run containing the signed candidate and receipt
        type: string
        required: true
      artifact_name:
        description: Exact artifact name from that build run
        type: string
        required: true
      upload:
        description: Upload the verified binary to internal testing
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: mobile-internal-testing-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 20
    outputs:
      upload_environment: ${{ steps.destination.outputs.environment }}
    env:
      GH_TOKEN: ${{ github.token }}
      BETA_PLATFORM: ${{ inputs.platform }}
      BETA_SOURCE_COMMIT: ${{ inputs.source_commit }}
      BETA_BUILD_RUN_ID: ${{ inputs.build_run_id }}
      BETA_ARTIFACT_NAME: ${{ inputs.artifact_name }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Define isolated candidate directory
        run: printf 'BETA_ARTIFACT_DIR=%s/mobile-candidate\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Verify the existing protected upload destination
        id: destination
        if: inputs.upload
        run: python3 scripts/mobile_testing.py destination
      - name: Check source run and download its exact candidate
        run: python3 scripts/mobile_testing.py download
      - name: Verify checksum, app identity, version, signing and build receipt
        run: python3 scripts/mobile_testing.py verify
      - name: Record validation result
        run: echo 'Candidate verified. No upload has run in this job.' >> "$GITHUB_STEP_SUMMARY"

  upload:
    needs: validate
    if: inputs.upload
    environment: ${{ needs.validate.outputs.upload_environment }}
    runs-on: macos-26
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      BETA_PLATFORM: ${{ inputs.platform }}
      BETA_SOURCE_COMMIT: ${{ inputs.source_commit }}
      BETA_BUILD_RUN_ID: ${{ inputs.build_run_id }}
      BETA_ARTIFACT_NAME: ${{ inputs.artifact_name }}
      IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
      ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_OPT_OUT_USAGE: '1'
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.3'
          bundler-cache: false
          working-directory: mobile-testing
      - name: Install pinned submission tooling
        working-directory: mobile-testing
        run: bundle install
      - name: Define isolated candidate directory
        run: printf 'BETA_ARTIFACT_DIR=%s/mobile-candidate\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Recheck source run and retrieve the same candidate
        run: python3 scripts/mobile_testing.py download
      - name: Submit this candidate to internal testing
        working-directory: mobile-testing
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bundle exec fastlane mobile_testing
      - name: Record upload boundary
        run: echo 'Upload command succeeded. Store processing, group access and a real tester installation remain to be verified.' >> "$GITHUB_STEP_SUMMARY"
