name: Build release image artifact

# Build only. The reviewed SSH controller remains the production deploy path.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-release-artifact-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    # Source-only artifacts inherit the repository's existing access policy.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RELEASE_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source revision
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$RELEASE_REVISION" ]]
          test -f Dockerfile
          grep -Fxq '.env' .dockerignore
          grep -Fxq '.env.*' .dockerignore
      - name: Scan public source for credential leaks
        run: node scripts/check-secrets.mjs .
      - name: Set up isolated image builder
        uses: docker/setup-buildx-action@v4
      - name: Build exact amd64 OCI gzip image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 \
            --file Dockerfile --build-arg "APP_REVISION=$RELEASE_REVISION" \
            --label "org.opencontainers.image.revision=$RELEASE_REVISION" \
            --tag "ashbi-platform:$RELEASE_REVISION" \
            --provenance=false --sbom=false \
            --output "type=oci,dest=$RUNNER_TEMP/release-builder.oci.tar,compression=gzip,force-compression=true,oci-mediatypes=true" .
      - name: Validate and canonicalize OCI artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-artifact
          python3 scripts/deploy/prepare-oci-artifact.py \
            --input "$RUNNER_TEMP/release-builder.oci.tar" \
            --output "release-artifact/ashbi-platform-$RELEASE_REVISION-oci-gzip.tar" \
            --revision "$RELEASE_REVISION" \
            --builder-run-id "$GITHUB_RUN_ID" --repository "$GITHUB_REPOSITORY"
      - name: Retain image archive and verification metadata
        uses: actions/upload-artifact@v7
        with:
          name: ashbi-release-${{ github.sha }}
          path: |
            release-artifact/*.tar
            release-artifact/metadata.json
            release-artifact/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
