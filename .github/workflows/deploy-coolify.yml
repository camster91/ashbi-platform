name: Publish and promote immutable image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  release-gates:
    name: Required release gates
    uses: ./.github/workflows/release-gates.yml

  publish:
    name: Publish immutable image
    needs: release-gates
    uses: ./.github/workflows/build-and-push.yml
    secrets: inherit

  staging:
    name: Promote exact image to staging
    needs: publish
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-vps.yml
    with:
      environment: staging
      image: ${{ needs.publish.outputs.image }}
      digest: ${{ needs.publish.outputs.digest }}
      revision: ${{ github.sha }}
      root_dir: /opt/ashbi-platform-staging
      container_name: ashbi-platform-staging
      host_port: '3003'
    secrets:
      VPS_HOST: ${{ secrets.STAGING_VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.STAGING_VPS_SSH_KEY }}

  production:
    name: Promote verified image to production
    needs: [publish, staging]
    uses: ./.github/workflows/deploy-vps.yml
    with:
      environment: production
      image: ${{ needs.publish.outputs.image }}
      digest: ${{ needs.publish.outputs.digest }}
      revision: ${{ github.sha }}
      root_dir: /opt/ashbi-platform
      container_name: ashbi-platform
      host_port: '3002'
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
