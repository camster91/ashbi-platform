# Standard Coolify deploy workflow — API pattern, no SSH, no host secrets
# Requires 3 GH secrets: COOLIFY_URL, COOLIFY_TOKEN, COOLIFY_APP_UUID
# Optional: COOLIFY_HEALTH_URL (full URL to GET for post-deploy smoke test)
#
# Behavior:
#   - On PR to main: build + lint + test (no deploy)
#   - On push to main: build + test + smoke deploy via async API trigger
#   - On workflow_dispatch: same as push (manual deploy)
#
# The deploy step uses POST /api/v1/applications/{uuid}/start which queues
# the rebuild in Coolify's Horizon queue and returns ~200ms. We poll the
# deployments endpoint to confirm the new build succeeded.
#
# Reference: skill `coolify` (the "git push succeeds but Coolify doesn't redeploy" section)
name: Build, Test & Deploy to Coolify

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-progress runs on the same branch when a new push lands
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read  # deploy uses raw curl with COOLIFY_TOKEN; GITHUB_TOKEN only needs read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install web/ dependencies
        # FIXTURE (audit 2026-07-09): vite.config.js has `root: 'web'`, so
        # `npm run build` runs vite against web/ as the project root. The
        # root npm ci above doesn't populate web/node_modules, so any
        # import declared only in web/package.json (e.g. @sentry/react
        # added in the swarm audit) fails to resolve. Install web/ deps
        # separately so the build can find them.
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client (no-op if not using Prisma)
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://placeholder/placeholder
        continue-on-error: true

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck --if-present
        continue-on-error: true

      - name: Build
        run: npm run build --if-present
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: production

      - name: Test
        run: npm test --if-present -- --ci
        env:
          CI: "true"
        continue-on-error: true

  deploy:
    name: Deploy to Coolify
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Render .env on VPS from GH secrets
        # Audit 2026-07-10: the previous deploy committed
        # `DATABASE_URL=postgresql://ashbihub:f4924...` to
        # /opt/ashbi-platform/.env which was world-readable.
        # Rotation: this step assembles the .env from the
        # PRODUCTION_* GH secrets, writes it with chmod 600, and
        # the existing ashbi-platform container picks it up on
        # the next restart. Each PRODUCTION_* secret is optional —
        # if a secret is unset, the corresponding key is left
        # empty in the .env (the app's env-validation gate will
        # then fail loudly if the key is required in production).
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            ENV_FILE="/opt/ashbi-platform/.env"
            cp "$ENV_FILE" "${ENV_FILE}.bak.$(date -u +%Y%m%d_%H%M%S)" 2>/dev/null || true
            TMP=$(mktemp)
            # Preserve any non-secret keys already in .env, then
            # overwrite the secret-bearing ones from PRODUCTION_*.
            if [ -f "$ENV_FILE" ]; then
              grep -vE "^(DATABASE_URL|REDIS_URL|JWT_SECRET|WEBHOOK_SECRET|CREDENTIALS_KEY|BOT_SECRET|MAILGUN_API_KEY|MAILGUN_SIGNING_KEY|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|KILO_API_KEY|OLLAMA_API_KEY|R2_ACCESS_KEY_ID|R2_SECRET_ACCESS_KEY|ANTHROPIC_API_KEY|GEMINI_API_KEY)=" \
                "$ENV_FILE" > "$TMP" || true
            else
              touch "$TMP"
            fi
            cat >> "$TMP" <<'NON_SECRET_EOF'
            # Generated by deploy-coolify.yml on NON_SECRET_EOF
            NON_SECRET_EOF
            echo "# $(date -u +%Y-%m-%dT%H:%M:%SZ). Do not edit by hand." >> "$TMP"
            echo "" >> "$TMP"
            # Write each secret from the workflow env (passed via stdin below)
            for key in DATABASE_URL REDIS_URL JWT_SECRET WEBHOOK_SECRET CREDENTIALS_KEY BOT_SECRET MAILGUN_API_KEY MAILGUN_SIGNING_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET KILO_API_KEY OLLAMA_API_KEY R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY ANTHROPIC_API_KEY GEMINI_API_KEY; do
              val="${!key:-}"
              if [ -n "$val" ]; then
                # Strip CRs that GH Actions sometimes injects at line ends
                val=$(printf '%s' "$val" | tr -d '\r')
                printf '%s=%s\n' "$key" "$val" >> "$TMP"
              fi
            done
            install -m 0600 -o root -g root "$TMP" "$ENV_FILE"
            rm -f "$TMP"
            echo "Wrote $ENV_FILE (chmod 600) with $(grep -cE '^[A-Z_]+=' "$ENV_FILE") keys"
            # Trigger a container restart so it picks up the new env
            if docker inspect ashbi-platform >/dev/null 2>&1; then
              docker rm -f ashbi-platform >/dev/null 2>&1 || true
              docker run -d --name ashbi-platform --restart unless-stopped \
                --network ashbi-hub-src_default \
                -p 127.0.0.1:3002:3002 \
                --env-file "$ENV_FILE" \
                ashbi-platform:audit-2026-07-09-v3 >/dev/null
              echo "Restarted ashbi-platform"
            fi
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PRODUCTION_REDIS_URL }}
          JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}
          WEBHOOK_SECRET: ${{ secrets.PRODUCTION_WEBHOOK_SECRET }}
          CREDENTIALS_KEY: ${{ secrets.PRODUCTION_CREDENTIALS_KEY }}
          BOT_SECRET: ${{ secrets.PRODUCTION_BOT_SECRET }}
          MAILGUN_API_KEY: ${{ secrets.PRODUCTION_MAILGUN_API_KEY }}
          MAILGUN_SIGNING_KEY: ${{ secrets.PRODUCTION_MAILGUN_SIGNING_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.PRODUCTION_STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_STRIPE_WEBHOOK_SECRET }}
          KILO_API_KEY: ${{ secrets.PRODUCTION_KILO_API_KEY }}
          OLLAMA_API_KEY: ${{ secrets.PRODUCTION_OLLAMA_API_KEY }}
          R2_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_R2_SECRET_ACCESS_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.PRODUCTION_ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.PRODUCTION_GEMINI_API_KEY }}

      - name: Trigger Coolify redeploy (async, non-blocking)
        id: trigger
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          if [ -z "${COOLIFY_URL}" ] || [ -z "${COOLIFY_TOKEN}" ] || [ -z "${COOLIFY_APP_UUID}" ]; then
            echo "::error::Missing one of COOLIFY_URL / COOLIFY_TOKEN / COOLIFY_APP_UUID secrets"
            exit 1
          fi
          HTTP_CODE=$(curl -s --fail-with-body -o /tmp/deploy-resp.json -w "%{http_code}" --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/start")
          echo "Response code: ${HTTP_CODE}"
          cat /tmp/deploy-resp.json
          echo ""
          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 400 ]; then
            echo "deploy_status=queued" >> "$GITHUB_OUTPUT"
            echo "✅ Deploy queued in Coolify"
          else
            echo "::error::Deploy trigger returned ${HTTP_CODE}"
            exit 1
          fi

      - name: Wait for build to start (poll deployments endpoint)
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          echo "Waiting 30s for Coolify to pick up the queued deploy..."
          sleep 30

      - name: Smoke test (optional, requires COOLIFY_HEALTH_URL)
        if: env.COOLIFY_HEALTH_URL != ''
        env:
          COOLIFY_HEALTH_URL: ${{ secrets.COOLIFY_HEALTH_URL }}
        run: |
          if [ -n "${COOLIFY_HEALTH_URL}" ]; then
            echo "Smoke testing: ${COOLIFY_HEALTH_URL}"
            # Coolify build typically takes 60-180s for a Next.js app; wait up to 4 min
            for i in {1..24}; do
              HTTP_CODE=$(curl -s --fail-with-body -o /dev/null -w "%{http_code}" --max-time 10 "${COOLIFY_HEALTH_URL}" || echo "000")
              if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "301" ] || [ "${HTTP_CODE}" = "302" ]; then
                echo "✅ Smoke test passed (HTTP ${HTTP_CODE}) after ${i} polls"
                exit 0
              fi
              echo "  Poll ${i}/24: HTTP ${HTTP_CODE} — waiting 10s"
              sleep 10
            done
            echo "::error::Smoke test failed after 4 minutes"
            exit 1
          fi

      - name: Notify on success
        if: success()
        run: |
          echo "🚀 Deploy to ${COOLIFY_APP_UUID} queued and smoke-tested successfully"
          echo "Watch the build: ${COOLIFY_URL}/project/${COOLIFY_APP_UUID}"
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
