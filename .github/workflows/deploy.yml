name: Build, Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to deploy (branch, tag, or SHA)'
        required: true
        default: 'main'
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options: [staging, production]

concurrency:
  group: deploy-${{ github.event.inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci --legacy-peer-deps

      - name: Install backend deps
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        working-directory: web
        env:
          DATABASE_URL: 'postgresql://placeholder/placeholder'
        run: npx prisma generate

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: web/dist/
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging (build verification)
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://hub.ashbi.ca
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: dist-${{ github.sha }}
          path: web/dist/

      - name: Staging deploy summary
        run: |
          echo "Staging build verified for PR #${{ github.event.pull_request.number }}"
          echo "Branch: ${{ github.head_ref }}"
          echo "SHA: ${{ github.sha }}"
          echo "Build artifact size:"
          du -sh web/dist/

  deploy-production:
    name: Deploy to Production
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hub.ashbi.ca
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: dist-${{ github.sha }}
          path: dist/

      - name: Deploy to live container via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.COOLIFY_HOST }}
          username: ${{ secrets.COOLIFY_USER }}
          key: ${{ secrets.COOLIFY_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            CONTAINER="ashbi-platform"
            DEPLOY_DIR="/var/www/agency-hub"

            # Pre-flight: live site must be healthy before we touch it
            PRE_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://hub.ashbi.ca/api/health || echo "000")
            echo "Pre-deploy health: HTTP $PRE_STATUS"
            if [ "$PRE_STATUS" != "200" ]; then
              echo "Refusing to deploy: live site unhealthy"
              exit 1
            fi

            # Sync repo on server
            cd "$DEPLOY_DIR"
            git fetch origin main
            git reset --hard origin/main

            # Clear old dist in container (avoid Pattern F: stale chunks)
            docker exec "$CONTAINER" sh -c "rm -rf /app/dist/assets/* /app/dist/index.html /app/dist/manifest.json /app/dist/sw.js /app/dist/icon-*.png"

            # Tar and pipe the new dist
            tar czf - -C "$GITHUB_WORKSPACE/dist" . | docker exec -i "$CONTAINER" sh -c "tar xzf - -C /app/dist"

            # Verify only ONE index-*.js exists (Pattern F prevention)
            COUNT=$(docker exec "$CONTAINER" sh -c "ls /app/dist/assets/index-*.js 2>/dev/null | wc -l")
            if [ "$COUNT" != "1" ]; then
              echo "Multiple bundles detected (count=$COUNT) - aborting"
              docker logs "$CONTAINER" --tail 30
              exit 1
            fi

            # Restart container to pick up any backend source changes
            docker restart "$CONTAINER" > /dev/null
            sleep 8

            # Health check loop
            MAX=12
            i=0
            while [ $i -lt $MAX ]; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://hub.ashbi.ca/api/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Post-deploy health: OK"
                break
              fi
              echo "Waiting... $i (HTTP $STATUS)"
              sleep 5
              i=$((i+1))
            done

            if [ $i -eq $MAX ]; then
              echo "DEPLOY FAILED after 60s"
              docker logs "$CONTAINER" --tail 50
              exit 1
            fi

            # Verify the new bundle hash is being served
            CONTAINER_BUNDLE=$(docker exec "$CONTAINER" sh -c "grep -oE 'index-[A-Za-z0-9_-]+\.js' /app/dist/index.html | head -1")
            SERVED_BUNDLE=$(curl -s https://hub.ashbi.ca/ | grep -oE "index-[A-Za-z0-9_-]+\.js" | head -1)
            echo "Container bundle: $CONTAINER_BUNDLE"
            echo "Served bundle:    $SERVED_BUNDLE"
            if [ "$CONTAINER_BUNDLE" != "$SERVED_BUNDLE" ]; then
              echo "Bundle mismatch - deploy verification failed"
              exit 1
            fi

            echo "DEPLOY COMPLETE: $SERVED_BUNDLE"
