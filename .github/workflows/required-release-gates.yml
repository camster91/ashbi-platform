name: Required release gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-release-gates-${{ github.ref }}
  # Superseded PR pushes may be cancelled; every main push must finish so each
  # merge is verified even when two land in quick succession.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-gates:
    name: Required release gates
    uses: ./.github/workflows/release-gates.yml
