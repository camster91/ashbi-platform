# Staging deploy workflow — same shape as deploy-coolify.yml but pointing
# at the STAGING environment. Parallel to prod, separate secrets, same
# pattern.
#
# Requires 3 GH secrets: COOLIFY_STAGING_URL, COOLIFY_STAGING_TOKEN,
# COOLIFY_STAGING_APP_UUID
# Optional: COOLIFY_STAGING_HEALTH_URL
#
# Triggered on push to main + workflow_dispatch (manual).

name: Build, Test & Deploy to Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs on the same branch when a new push lands
concurrency:
  group: deploy-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-gates:
    name: Required release gates
    uses: ./.github/workflows/release-gates.yml

  deploy:
    name: Deploy to Coolify (staging)
    needs: release-gates
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Coolify redeploy (async, non-blocking)
        id: trigger
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_STAGING_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_STAGING_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_STAGING_APP_UUID }}
        run: |
          if [ -z "${COOLIFY_URL}" ] || [ -z "${COOLIFY_TOKEN}" ] || [ -z "${COOLIFY_APP_UUID}" ]; then
            echo "::error::Missing one of COOLIFY_STAGING_URL / COOLIFY_STAGING_TOKEN / COOLIFY_STAGING_APP_UUID secrets."
            echo "Add them at: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          HTTP_CODE=$(curl -s --fail-with-body -o /tmp/deploy-resp.json -w "%{http_code}" --max-time 60 \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            "${COOLIFY_URL}/api/v1/applications/${COOLIFY_APP_UUID}/start")
          echo "Response code: ${HTTP_CODE}"
          cat /tmp/deploy-resp.json
          echo ""
          if [ "${HTTP_CODE}" -ge 200 ] && [ "${HTTP_CODE}" -lt 400 ]; then
            echo "deploy_status=queued" >> "$GITHUB_OUTPUT"
            echo "✅ Staging deploy queued in Coolify"
          else
            echo "::error::Deploy trigger returned ${HTTP_CODE}"
            exit 1
          fi

      - name: Wait for build to start
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_STAGING_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_STAGING_TOKEN }}
        run: |
          echo "Waiting 30s for Coolify to pick up the queued deploy..."
          sleep 30

      - name: Smoke test (optional)
        if: env.COOLIFY_STAGING_HEALTH_URL != ''
        env:
          COOLIFY_STAGING_HEALTH_URL: ${{ secrets.COOLIFY_STAGING_HEALTH_URL }}
        run: |
          if [ -n "${COOLIFY_STAGING_HEALTH_URL}" ]; then
            echo "Smoke testing: ${COOLIFY_STAGING_HEALTH_URL}"
            for i in {1..24}; do
              HTTP_CODE=$(curl -s --fail-with-body -o /dev/null -w "%{http_code}" --max-time 10 "${COOLIFY_STAGING_HEALTH_URL}" || echo "000")
              if [ "${HTTP_CODE}" = "200" ] || [ "${HTTP_CODE}" = "301" ] || [ "${HTTP_CODE}" = "302" ]; then
                echo "✅ Staging smoke test passed (HTTP ${HTTP_CODE}) after ${i} polls"
                exit 0
              fi
              echo "  Poll ${i}/24: HTTP ${HTTP_CODE} — waiting 10s"
              sleep 10
            done
            echo "::error::Staging smoke test failed after 4 minutes"
            exit 1
          fi

      - name: Notify on success
        if: success()
        run: |
          echo "🚀 Staging deploy to ${COOLIFY_APP_UUID} queued and smoke-tested successfully"
          env | grep COOLIFY_ || true
