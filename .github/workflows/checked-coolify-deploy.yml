name: Checked Coolify release

on:
  workflow_run:
    workflows: [Required release gates]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ashbi-production-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      vars.COOLIFY_RELEASE_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Skip superseded revisions and validate successful CI source
        id: source
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            if (!/^[a-f0-9]{40}$/.test(run.head_sha)) throw new Error('Invalid CI revision');
            const ref = await github.rest.git.getRef({ ...context.repo, ref: `heads/${run.head_branch}` });
            core.setOutput('current', String(ref.data.object.sha === run.head_sha));
            if (ref.data.object.sha !== run.head_sha) core.notice('A newer default-branch revision will be released after its own CI succeeds');
      - name: Checkout verified revision
        if: steps.source.outputs.current == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Node
        if: steps.source.outputs.current == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test release safety checks
        if: steps.source.outputs.current == 'true'
        run: |
          node --test src/tests/unit/coolify-release.test.mjs src/tests/unit/production-backup.test.mjs src/tests/unit/coolify-migration-floor.test.mjs
          python3 scripts/deploy/test-backup-ssh-command.py
      - name: Create and verify encrypted production backup
        if: steps.source.outputs.current == 'true'
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          ASHBI_BACKUP_SSH_KEY: ${{ secrets.ASHBI_BACKUP_SSH_KEY }}
          ASHBI_VPS_KNOWN_HOSTS: ${{ vars.ASHBI_VPS_KNOWN_HOSTS }}
        run: node scripts/deploy/production-backup.mjs
      - name: Retain verified encrypted pre-deployment backup
        if: steps.source.outputs.current == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ashbi-production-backup-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/ashbi-release-backup/
          if-no-files-found: error
          retention-days: 30
      - name: Deploy verified revision and await readiness
        if: steps.source.outputs.current == 'true'
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          COOLIFY_RELEASE_ENABLED: ${{ vars.COOLIFY_RELEASE_ENABLED }}
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: node scripts/deploy/coolify-release.mjs
