name: Secret leak gate

on:
  push:
    branches: [main, master, fix/**, chore/**, security/**]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  check-secrets:
    name: Scan for hardcoded credentials
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan repository
        run: node scripts/check-secrets.mjs .

      - name: Verify JSON password regression detection
        run: |
          fixture="$(mktemp -d)"
          printf '%s\n' '{"email":"fixture@example.invalid","password":"RegressionOnly-123!"}' > "$fixture/login.json"
          if node scripts/check-secrets.mjs "$fixture"; then
            echo "::error::Secret scanner accepted a representative hardcoded JSON password"
            exit 1
          fi
          echo "Regression fixture correctly rejected"

      - name: Verify documented login credential regression detection
        run: |
          unsafe_fixture="$(mktemp -d)"
          printf '%s\n' '- Login as fixture@example.invalid with: RegressionOnly-123!' > "$unsafe_fixture/deployment.md"
          if node scripts/check-secrets.mjs "$unsafe_fixture"; then
            echo "::error::Secret scanner accepted representative Markdown login material"
            exit 1
          fi

          bypass_fixture="$(mktemp -d)"
          printf '%s\n' '- Login as fixture@example.invalid with: Example2026!' > "$bypass_fixture/deployment.md"
          if node scripts/check-secrets.mjs "$bypass_fixture"; then
            echo "::error::Secret scanner accepted a credential beginning with a former placeholder prefix"
            exit 1
          fi

          safe_fixture="$(mktemp -d)"
          printf '%s\n' '- Login as fixture@example.invalid with: CHANGE_ME' > "$safe_fixture/deployment.md"
          node scripts/check-secrets.mjs "$safe_fixture"
          echo "Markdown credential regressions correctly rejected without blocking non-matching placeholders"

      - name: Verify client-book export regression detection
        run: |
          roster="$(mktemp -d)"
          printf '%s\n' \
            "const clients = [" \
            "  { contactPerson: 'Fixture One', email: 'one@fixture-client.co', totalRevenueUsd: 1 }," \
            "  { contactPerson: 'Fixture Two', email: 'two@fixture-client.co', totalRevenueUsd: 2 }," \
            "  { contactPerson: 'Fixture Three', email: 'three@fixture-client.co', totalRevenueUsd: 3 }," \
            "  { contactPerson: 'Fixture Four', email: 'four@fixture-client.co', totalRevenueUsd: 4 }," \
            "  { contactPerson: 'Fixture Five', email: 'five@fixture-client.co', totalRevenueUsd: 5 }," \
            "];" > "$roster/clients.js"
          if node scripts/check-secrets.mjs "$roster"; then
            echo "::error::Secret scanner accepted a representative client-book export"
            exit 1
          fi

          address="$(mktemp -d)"
          printf '%s\n' \
            "const clients = [" \
            "  { contactPerson: 'Alex Example', email: 'alex@example.invalid', totalRevenueUsd: 1, address: '2260 E University Drive', postalCode: '85213' }," \
            "  { contactPerson: 'Blair Sample', email: 'blair@example.invalid', totalRevenueUsd: 2 }," \
            "  { contactPerson: 'Casey Placeholder', email: 'casey@example.test', totalRevenueUsd: 3 }," \
            "  { contactPerson: 'Drew Example', email: 'drew@example.invalid', totalRevenueUsd: 4 }," \
            "  { contactPerson: 'Eden Example', email: 'eden@northwind.example', totalRevenueUsd: 5 }," \
            "];" > "$address/clients.js"
          if node scripts/check-secrets.mjs "$address"; then
            echo "::error::Secret scanner accepted a representative client street address"
            exit 1
          fi

          sample="$(mktemp -d)"
          printf '%s\n' \
            "const clients = [" \
            "  { contactPerson: 'Alex Example', email: 'alex@example.invalid', totalRevenueUsd: 1 }," \
            "  { contactPerson: 'Blair Sample', email: 'blair@example.invalid', totalRevenueUsd: 2 }," \
            "  { contactPerson: 'Casey Placeholder', email: 'casey@example.test', totalRevenueUsd: 3 }," \
            "  { contactPerson: 'Drew Example', email: 'drew@example.invalid', totalRevenueUsd: 4 }," \
            "  { contactPerson: 'Eden Example', email: 'eden@northwind.example', totalRevenueUsd: 5 }," \
            "];" > "$sample/clients.js"
          node scripts/check-secrets.mjs "$sample"
          echo "Client-book export regressions correctly rejected without blocking documentation emails"
