name: Secret leak gate

# Scans the repo for hardcoded credentials that should be in GH secrets
# instead. Fails the build on:
#   - `postgresql://user:password@host` patterns with a real-looking
#     password (>= 20 char non-placeholder value)
#   - `redis://user:password@host` patterns
#   - `sk_live_*`, `sk_test_*` Stripe key patterns
#   - `AKIA[0-9A-Z]{16}` AWS access key patterns
#
# Allowed (intentionally):
#   - .env.example placeholders (e.g. `your-postgres-password`,
#     `CHANGE_ME_LOCAL_DEV_ONLY`)
#   - .env (gitignored)
#   - The .github/workflows/check-secrets.yml file itself (it contains
#     the patterns we look for)
#
# Audit origin: 2026-07-10 deploy cleanup — the previous deploy
# committed a hardcoded `DATABASE_URL=postgresql://ashbihub:f4924...`
# to the VPS /opt/ashbi-platform/.env, which was world-readable.
# Pattern fixed by moving the value to GH secret PRODUCTION_DATABASE_URL
# and chmod 600'ing the .env.

on:
  push:
    branches: [main, master, fix/**, chore/**]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  check-secrets:
    name: Scan for hardcoded credentials
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan for postgres / redis URLs with non-placeholder passwords
        run: |
          set -e
          BAD=0

          # postgres://user:PASSWORD@host
          # The "password" group must be at least 20 chars and not a placeholder.
          # Placeholders we allow: your-*, CHANGE_ME*, password, placeholder, *PLACEHOLDER*, *-dev-*
          PG_HITS=$(grep -rEn "postgresql?://[a-zA-Z0-9_]+:[A-Za-z0-9_!@#$%^&*()+=\-]{20,}@" \
            --include="*.js" --include="*.ts" --include="*.json" --include="*.yml" --include="*.yaml" \
            --include="*.md" --include="*.sh" --include="*.env*" --include="*.py" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist --exclude-dir=web/dist \
            . 2>/dev/null || true)

          for line in $PG_HITS; do
            file=$(echo "$line" | cut -d: -f1)
            # Allow if the file is .env.example and the password matches a placeholder
            if [[ "$file" == *.env.example ]] || [[ "$file" == *check-secrets.yml ]]; then
              continue
            fi
            # Allow if the password looks like a placeholder
            password=$(echo "$line" | sed -E 's|.*://[^:]+:([^@]+)@.*|\1|')
            if echo "$password" | grep -qE "(your-|CHANGE_ME|placeholder|PLACEHOLDER|change-me|REPLACE)"; then
              continue
            fi
            echo "::error file=$file::Hardcoded postgres password detected: $line"
            BAD=1
          done

          REDIS_HITS=$(grep -rEn "redis://[^:]+:[A-Za-z0-9_!@#$%^&*()+=\-]{16,}@" \
            --include="*.js" --include="*.ts" --include="*.json" --include="*.yml" --include="*.yaml" \
            --include="*.md" --include="*.sh" --include="*.env*" --include="*.py" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
            . 2>/dev/null || true)

          for line in $REDIS_HITS; do
            file=$(echo "$line" | cut -d: -f1)
            if [[ "$file" == *.env.example ]] || [[ "$file" == *check-secrets.yml ]]; then
              continue
            fi
            echo "::error file=$file::Hardcoded redis password detected: $line"
            BAD=1
          done

          # Stripe live/test keys
          STRIPE_HITS=$(grep -rEn "sk_(live|test)_[A-Za-z0-9]{20,}" \
            --include="*.js" --include="*.ts" --include="*.json" --include="*.yml" --include="*.yaml" \
            --include="*.md" --include="*.sh" --include="*.env*" --include="*.py" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
            . 2>/dev/null || true)

          for line in $STRIPE_HITS; do
            file=$(echo "$line" | cut -d: -f1)
            if [[ "$file" == *.env.example ]] || [[ "$file" == *check-secrets.yml ]]; then
              continue
            fi
            echo "::error file=$file::Stripe secret key detected: $line"
            BAD=1
          done

          # AWS access keys
          AWS_HITS=$(grep -rEn "AKIA[0-9A-Z]{16}" \
            --include="*.js" --include="*.ts" --include="*.json" --include="*.yml" --include="*.yaml" \
            --include="*.md" --include="*.sh" --include="*.env*" --include="*.py" \
            --exclude-dir=node_modules --exclude-dir=.git --exclude-dir=dist \
            . 2>/dev/null || true)

          for line in $AWS_HITS; do
            file=$(echo "$line" | cut -d: -f1)
            if [[ "$file" == *.env.example ]] || [[ "$file" == *check-secrets.yml ]]; then
              continue
            fi
            echo "::error file=$file::AWS access key detected: $line"
            BAD=1
          done

          if [ $BAD -eq 1 ]; then
            echo ""
            echo "::error::Secret leak gate failed. Move the value to a GH secret (e.g. PRODUCTION_DATABASE_URL) and reference it from the workflow. See PRODUCTION_DEPLOYMENT.md for the rotation procedure."
            exit 1
          fi

          echo "Secret leak gate: PASS (no hardcoded credentials found)"
