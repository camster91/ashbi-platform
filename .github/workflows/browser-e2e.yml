name: Browser E2E smoke

on:
  pull_request:
    paths:
      - 'tests/login.spec.ts'
      - 'playwright.config.ts'
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-e2e:
    name: Desktop, mobile, and accessibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix web --no-audit --no-fund

      - name: Install browser runtimes
        run: npx playwright install --with-deps chromium webkit

      - name: Run browser smoke
        run: npm run test:browser
        env:
          CI: true

      - name: Upload sanitized failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
