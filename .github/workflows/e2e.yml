name: E2E smoke (wp-env + hub)

# Plan 11 / Plan 12 final integration gate.
#
# Boots wp-env (WordPress 6.6 + ashbi-agency-wp-bridge plugin from the
# feat/magic-login-managewp-grade branch) + a hub docker-compose stack
# (Postgres + migrate + seed + hub), then runs the 14-step magic-login
# smoke.
#
# The required release workflow owns the blocking PR/deploy run. This wrapper
# remains available for a focused manual rerun while debugging the stack.
#
# Acceptance gate: 14/14 steps pass in <5 minutes.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Magic-login E2E smoke (14 steps)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # wp-env needs Docker (it spins up WordPress + MariaDB containers
      # internally). GitHub-hosted runners have it pre-installed.
      - name: Verify Docker is available
        run: |
          docker info >/dev/null
          echo "Docker $(docker --version) is ready"

      - name: Boot the stack (wp-env + hub + db)
        run: npm run test:e2e:setup
        env:
          HOST_PORT: 3001
          HUB_DB_PORT: 54329
          CI: true

      - name: Run vitest 14-step smoke
        run: npm run test:e2e
        env:
          CI: true
          HUB_BASE: http://localhost:3001
          WP_BASE: http://localhost:8888
          SHARED_SECRET: test-e2e-secret-12345

      - name: Dump docker logs on failure
        if: failure()
        run: |
          echo "==== hub logs ===="
          docker compose -f tests/e2e/docker-compose.test.yml --project-name ashbi-e2e logs hub --no-color | tail -200 || true
          echo "==== migrate logs ===="
          docker compose -f tests/e2e/docker-compose.test.yml --project-name ashbi-e2e logs migrate --no-color | tail -100 || true
          echo "==== seed logs ===="
          docker compose -f tests/e2e/docker-compose.test.yml --project-name ashbi-e2e logs seed --no-color | tail -100 || true
          echo "==== postgres logs ===="
          docker compose -f tests/e2e/docker-compose.test.yml --project-name ashbi-e2e logs postgres --no-color | tail -100 || true
          echo "==== wp-env logs ===="
          npx wp-env logs --no-color 2>/dev/null | tail -200 || true

      - name: Upload vitest output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-e2e-output
          path: tests/e2e/.vitest-output.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Teardown
        if: always()
        run: npm run test:e2e:teardown
