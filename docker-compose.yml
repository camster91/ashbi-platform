services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ashbi-platform
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "3002:3002"
    # Run prisma migrate deploy once before the app starts. This avoids the
    # race condition where multiple replicas / rolling deploys each try to
    # apply migrations at the same time on container start.
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://ashbi:${DB_PASSWORD}@postgres:5432/ashbi?schema=public
      - REDIS_URL=redis://redis:6379
    networks:
      - ashbi-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ashbi-worker
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://ashbi:${DB_PASSWORD}@postgres:5432/ashbi?schema=public
      - REDIS_URL=redis://redis:6379
    healthcheck:
      test: ["CMD", "npm", "run", "health:worker"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - ashbi-network

  migrate:
    # One-shot migration runner. Runs `prisma migrate deploy` to completion and
    # exits. The app service waits on `service_completed_successfully` so
    # migrations always finish before any app replicas start.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ashbi-migrate
    restart: "no"
    env_file:
      - .env
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://ashbi:${DB_PASSWORD}@postgres:5432/ashbi?schema=public
    networks:
      - ashbi-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ashbi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ashbi
      POSTGRES_USER: ashbi
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/pgvector-init.sh:/docker-entrypoint-initdb.d/pgvector-init.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashbi -d ashbi"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # ⚠️ Postgres port is NOT exposed by default. The data store must only be
    # reachable via the internal Docker network (`ashbi-network`). For local
    # development with host-side `psql` access, use `docker-compose.dev.yml`,
    # which overlays port mappings for pg (5432) and redis (6379).
    networks:
      - ashbi-network

  redis:
    image: redis:7-alpine
    container_name: ashbi-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - redisdata:/data
    # ⚠️ Redis port is NOT exposed by default (see postgres note above).
    networks:
      - ashbi-network

volumes:
  pgdata:
  redisdata:

networks:
  ashbi-network:
    driver: bridge
